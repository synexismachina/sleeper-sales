<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sleeper Sales Quote Form</title>
  </head>

  <body>
    <form
      name="sleeper-sales-quote"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="sleeper-sales-quote" />

      <input name="bot-field" type="text" />

      <input name="subject" type="hidden" value="New Sleeper Sales Quote Request" />

      <input name="productType" type="text" />
      <input name="grade" type="text" />
      <input name="length" type="text" />
      <input name="quantity" type="text" />
      <input name="services" type="text" />

      <input name="fullName" type="text" />
      <input name="phone" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />

      <input name="deliveryArea" type="text" />
      <input name="deliveryDate" type="text" />
      <input name="projectType" type="text" />
      <input name="deliveryRequired" type="text" />

      <textarea name="notes"></textarea>
    </form>
  </body>
</html>
